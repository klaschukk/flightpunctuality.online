<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Flight Punctuality — Real delay statistics from public flight records">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset=".6" stop-color="#0d1526"/><stop offset="1" stop-color="#38bdf8" stop-opacity=".22"/></linearGradient>
<linearGradient id="tt" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"><animate attributeName="stop-color" values="#38bdf8;#818cf8;#38bdf8" dur="8s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#818cf8"/></linearGradient>
<radialGradient id="gl" cx=".2" cy=".1" r=".7"><stop offset="0" stop-color="#38bdf8" stop-opacity=".28"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<pattern id="gr" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
<clipPath id="r"><rect width="1200" height="300" rx="22"/></clipPath>
</defs>
<style>
.grow{transform-box:fill-box;transform-origin:bottom;animation:gr 3.2s ease-in-out infinite alternate}@keyframes gr{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
.slide{animation:sl 4s ease-in-out infinite alternate}@keyframes sl{from{transform:translateX(-10px);opacity:.55}to{transform:none;opacity:1}}
.float{animation:fl 3.6s ease-in-out infinite alternate}@keyframes fl{from{transform:translateY(6px)}to{transform:translateY(-6px)}}
.fill{animation:fi 3s ease-in-out infinite alternate}@keyframes fi{from{width:14px}to{width:var(--w)}}
.in{opacity:0;animation:up .9s ease-out forwards}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#r)">
<rect width="1200" height="300" fill="#0b1020"/><rect width="1200" height="300" fill="url(#bg)"/><rect width="1200" height="300" fill="url(#gr)"/><rect width="1200" height="300" fill="url(#gl)"/>
<g class="in"><text x="76" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="4" fill="#8b98a9">LIVE · EU261</text></g>
<text class="in" style="animation-delay:.15s" x="74" y="146" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="52" font-weight="800" letter-spacing="-1" fill="url(#tt)">Flight Punctuality</text>
<text class="in" style="animation-delay:.3s" x="76" y="196" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#c9d1d9">Real delay statistics from public flight records</text>
<g class="in" style="animation-delay:.45s"><rect x="76" y="222" width="82" height="32" rx="11" fill="#38bdf8" fill-opacity=".13" stroke="#38bdf8" stroke-opacity=".5"/><text x="117" y="243" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#e6edf3">Python</text><rect x="168" y="222" width="82" height="32" rx="11" fill="#38bdf8" fill-opacity=".13" stroke="#38bdf8" stroke-opacity=".5"/><text x="209" y="243" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#e6edf3">DuckDB</text><rect x="260" y="222" width="91" height="32" rx="11" fill="#38bdf8" fill-opacity=".13" stroke="#38bdf8" stroke-opacity=".5"/><text x="306" y="243" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#e6edf3">systemd</text></g>
<path d="M770,150 Q900,20 1030,110" fill="none" stroke="#38bdf8" stroke-opacity=".5" stroke-width="3" stroke-dasharray="7 9"/><circle cx="770" cy="150" r="6" fill="#0b1020" stroke="#38bdf8" stroke-width="2.5"/><circle cx="1030" cy="110" r="6" fill="#0b1020" stroke="#38bdf8" stroke-width="2.5"/><g><path d="M-12 0 L12 0 M0 -9 L8 0 L0 9 L-3 0 Z" fill="#818cf8" stroke="#818cf8" stroke-width="2" stroke-linejoin="round"/><animateMotion dur="6s" repeatCount="indefinite" path="M770,150 Q900,20 1030,110" rotate="auto"/></g><rect class="grow" style="animation-delay:0.00s" x="1040" y="112" width="28" height="78" rx="8" fill="#34d399" fill-opacity=".8"/><rect class="grow" style="animation-delay:0.25s" x="1080" y="144" width="28" height="46" rx="8" fill="#fbbf24" fill-opacity=".8"/><rect class="grow" style="animation-delay:0.50s" x="1120" y="170" width="28" height="20" rx="8" fill="#f87171" fill-opacity=".8"/><line x1="1032" y1="190" x2="1160" y2="190" stroke="#fff" stroke-opacity=".2"/><text x="770" y="235" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#8b98a9">arrival delay, settled flights only</text>
</g>
<rect x=".5" y=".5" width="1199" height="299" rx="22" fill="none" stroke="#fff" stroke-opacity=".12"/>
</svg>